<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Producto - Amargo y Dulce</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <!-- Navegación -->

    <nav>
        <div class="container-fluid">
            <div class="row rojo">

                <div class="col-md-1 col-2 align-self-center">
                    <img
                        class="marinero"
                        src="Assets/Bananero_de_chocolate_PNG-removebg-preview.png"
                        alt="Amargo y Dulce"
                    >
                </div>

                <div class="align-self-center col-xl-9 col-lg-8 col-md-8 col-6">
                    <a href="index.html" class="nav-link liberty">
                        <h1 class="display-4">Amargo y Dulce</h1>
                    </a>
                </div>

                <div class="col-md-1 col-1 pt-1">
                    <a href="carrito.html">
                        <img class="iconos" src="Assets/carrito.png" alt="Carrito">
                    </a>
                </div>

                <div class="col-md-1 col-1 offset-md-0 offset-1 text-center">

                    <button
                        class="navbar-toggler position-relative"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#opciones2"
                        aria-controls="opciones2"
                        aria-expanded="false"
                        aria-label="Abrir menú"
                    >
                        <span>
                            <img class="iconos pe-2 pt-2" src="Assets/menu.png" alt="Menú">
                        </span>
                    </button>

                    <div>
                        <div id="opciones2" class="z-1 position-absolute rounded-4 p-3 menu collapse">
                            <ul class="navbar-nav">

                                <li>
                                    <a class="nav-link lobster fs-5 mb-1" href="index.html">
                                        Inicio
                                    </a>
                                </li>

                                <li>
                                    <a class="nav-link lobster fs-5 mb-1" href="nosotros.html">
                                        Nosotros
                                    </a>
                                </li>

                                <li>
                                    <a class="nav-link lobster fs-5 mb-1" href="perfil.html">
                                        Tu perfil
                                    </a>
                                </li>

                                <li>
                                    <a class="nav-link lobster fs-5 mb-1" href="#" id="cerrar-sesion">
                                        Salir
                                    </a>
                                </li>

                            </ul>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </nav>


    <!-- Información del producto -->

    <main class="container mt-5 mb-5">

        <div class="row mb-4">
            <div class="col">
                <h1 class="lobster fw-bold display-4" id="nombre-producto">
                    Cargando producto...
                </h1>
            </div>
        </div>


        <div class="row producto">

            <!-- Imagen -->

            <div class="col-md-8 align-self-center">
                <img
                    id="imagen-producto"
                    class="img-fluid mx-auto d-block rounded-5 fondo-marron imagen-detalle-producto"
                    src=""
                    alt="Imagen del producto"
                >
            </div>


            <!-- Datos -->

            <div class="col-md-4 informacion-producto">

                <h2 class="lobster fw-bold">Acerca del producto</h2>

                <h3 class="fw-bold" id="precio-producto">
                    Cargando precio...
                </h3>

                <p id="sabor-producto"></p>
                <p id="cantidad-producto"></p>
                <p id="stock-producto"></p>
                <p id="calificacion-producto"></p>
                <p id="especial-producto"></p>

                <hr>


                <div class="row mb-4">

                    <label for="cantidad-compra" class="col-5 fw-bold">
                        Cantidad:
                    </label>

                    <div class="col">
                        <input
                            type="number"
                            class="form-control selector-cantidad"
                            id="cantidad-compra"
                            value="1"
                            min="1"
                            step="1"
                        >
                    </div>

                </div>


                <div class="row">

                    <div class="col-12 text-center mb-3">
                        <button
                            id="agregar-carrito"
                            class="btn btn-dark rounded-5"
                            type="button"
                            disabled
                        >
                            Agregar al carrito
                        </button>
                    </div>

                    <div class="col-12 text-center mb-3">
                        <a
                            href="carrito.html"
                            class="btn rojo rounded-5 text-white"
                        >
                            Ir al carrito
                        </a>
                    </div>

                </div>

                <div id="mensaje-producto" class="mt-3" role="alert"></div>

            </div>

        </div>


        <div class="row mt-4">
            <div class="col">
                <a href="index.html" class="btn btn-volver-productos rounded-5">
                    Volver a productos
                </a>
            </div>
        </div>

    </main>


    <!-- Footer -->

    <footer>
        <div class="container-fluid">

            <div class="row justify-content-around mt-4">

                <div class="col-8 liberty">
                    <a href="index.html">Amargo y Dulce</a>
                </div>

                <div class="col-2 pie">
                    <div class="row">

                        <div class="col">
                            <a href="index.html">Inicio</a>
                        </div>

                        <div class="col">
                            <a href="nosotros.html">Nosotros</a>
                        </div>

                    </div>
                </div>

            </div>


            <div class="row text-center">
                <div class="col info">
                    <p>
                        © 2025 Amargo y Dulce.
                        <br>
                        Para reclamos y consultas comunicarse al siguiente número:
                        +3442 222222
                    </p>
                </div>
            </div>

        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navegacion.js"></script>
    <script src="js/producto.js"></script>

</body>
</html>
