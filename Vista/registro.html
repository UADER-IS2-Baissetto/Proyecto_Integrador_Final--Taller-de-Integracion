          crossorigin="anonymous">

    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <nav>
        <div class="container-fluid">
            <div class="row rojo">
                <div class="col-md-1 col-2 align-self-center">
                    <img class="marinero" src="Assets/Bananero_de_chocolate_PNG-removebg-preview.png">
                </div>

                <div class="align-self-center col-xl-9 col-lg-8 col-md-8 col-6">
                    <a href="index.html" class="nav-link liberty">
                        <h1 class="display-4">Amargo y Dulce</h1>
                    </a>
                </div>

                <div class="col-md-1 col-1 pt-1">
                    <a href="carrito.html">
                        <img class="iconos" src="Assets/carrito.png">
                    </a>
                </div>

                <div class="col-md-1 col-1 offset-md-0 offset-1 text-center">
                    <button class="navbar-toggler position-relative" type="button"
                            data-bs-toggle="collapse" data-bs-target="#opciones2">
                        <span>
                            <img class="iconos pe-2 pt-2" src="Assets/menu.png">
                        </span>
                    </button>

                    <div>
                        <div id="opciones2" class="z-1 position-absolute rounded-4 p-3 menu collapse">
                            <ul class="navbar-nav">
                                <li>
                                    <a class="nav-link lobster fs-5 mb-1" href="index.html">Inicio</a>
                                </li>
                                <li>
                                    <a class="nav-link lobster fs-5 mb-1" href="nosotros.html">Nosotros</a>
                                </li>
                                <li>
                                    <a class="nav-link lobster fs-5 mb-1" href="login.html">Ingresar</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mt-3 mb-4">
        <h1 class="text-center lobster fw-bold">Crear cuenta</h1>

        <div class="row justify-content-center mt-3">
            <div class="col-md-8 col-lg-6 lobster">
                <div class="card login">
                    <div class="card-body">
                        <form id="form-registro">
                            <label for="nombre" class="form-label">Nombre:</label>
                            <input type="text" class="form-control mb-3"
                                   id="nombre" name="nombre" required>

                            <label for="apellido" class="form-label">Apellido:</label>
                            <input type="text" class="form-control mb-3"
                                   id="apellido" name="apellido" required>

                            <label for="correo" class="form-label">Correo electrónico:</label>
                            <input type="email" class="form-control mb-3"
                                   id="correo" name="correo"
                                   autocomplete="email" required>

                            <label for="direccion" class="form-label">Dirección:</label>
                            <input type="text" class="form-control mb-3"
                                   id="direccion" name="direccion" required>

                            <label for="contrasena" class="form-label">Contraseña:</label>
                            <input type="password" class="form-control mb-3"
                                   id="contrasena" name="contrasena"
                                   minlength="8" maxlength="30"
                                   autocomplete="new-password" required>

                            <label for="repetir-contrasena" class="form-label">
                                Repetir contraseña:
                            </label>
                            <input type="password" class="form-control mb-3"
                                   id="repetir-contrasena"
                                   autocomplete="new-password" required>

                            <div id="mensaje-registro" class="text-center mb-3"
                                 role="alert"></div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-danger text-black rojo">
                                    Registrarse
                                </button>

                                <a href="login.html" class="btn btn-secondary">
                                    Volver al login
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-3">
        <div class="container-fluid">
            <div class="row justify-content-around mt-4">
                <div class="col-8 liberty">
                    <a href="index.html">Amargo y Dulce</a>
                </div>

                <div class="col-2 pie">
                    <div class="row">
                        <div class="col">
                            <a href="index.html">Inicio</a>
                        </div>
                        <div class="col">
                            <a href="nosotros.html">Nosotros</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row text-center">
                <div class="col info">
                    <p>
                        © 2025 Amargo y Dulce.<br>
                        Para reclamos y consultas comunicarse al siguiente numero: +3442 222222
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
