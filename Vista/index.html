<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Amargo y Dulce</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <nav>
        <div class="container-fluid">
            <div class="row rojo">

                <div class="col-md-1 col-2 align-self-center">
                    <img
                        class="marinero"
                        src="Assets/Bananero_de_chocolate_PNG-removebg-preview.png"
                        alt="Amargo y Dulce"
                    >
                </div>

                <div class="align-self-center col-xl-9 col-lg-8 col-md-8 col-6">
                    <a href="index.html" class="nav-link liberty">
                        <h1 class="display-4">Amargo y Dulce</h1>
                    </a>
                </div>

                <div class="col-md-1 col-1 pt-1">
                    <a href="carrito.html">
                        <img class="iconos" src="Assets/carrito.png" alt="Carrito">
                    </a>
                </div>

                <div class="col-md-1 col-1 offset-md-0 offset-1 text-center">

                    <button
                        class="navbar-toggler position-relative"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#opciones2"
                        aria-controls="opciones2"
                        aria-expanded="false"
                        aria-label="Abrir menú"
                    >
                        <span>
                            <img class="iconos pe-2 pt-2" src="Assets/menu.png" alt="Menú">
                        </span>
                    </button>

                    <div>
                        <div id="opciones2" class="z-1 position-absolute rounded-4 p-3 menu collapse">
                            <ul class="navbar-nav">

                                <li class="nav-item">
                                    <a class="nav-link lobster fs-5 mb-1" href="index.html">
                                        Inicio
                                    </a>
                                </li>

                                <li>
                                    <a class="nav-link lobster fs-5 mb-1" href="nosotros.html">
                                        Nosotros
                                    </a>
                                </li>

                                <li>
                                    <a class="nav-link lobster fs-5 mb-1" href="perfil.html">
                                        Mi perfil
                                    </a>
                                </li>

                                <li>
                                    <a class="nav-link lobster fs-5 mb-1" href="#" id="cerrar-sesion">
                                        Salir
                                    </a>
                                </li>

                            </ul>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </nav>


    <!-- Promociones -->

    <div class="container-fluid mt-4 mb-4">

        <div id="carousel1" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-inner px-3" id="contenedor-promociones">
                <!-- Las promociones se generan desde js/inicio.js -->
            </div>

            <button
                class="carousel-control-prev"
                type="button"
                data-bs-target="#carousel1"
                data-bs-slide="prev"
                aria-label="Promoción anterior"
            >
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>

            <button
                class="carousel-control-next"
                type="button"
                data-bs-target="#carousel1"
                data-bs-slide="next"
                aria-label="Promoción siguiente"
            >
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>

        </div>

    </div>


    <!-- Título de productos -->

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12 text-center liston">
                <h1 class="liberty display-2">Nuestras variedades</h1>
            </div>
        </div>
    </div>


    <!-- Filtros -->

    <div class="container filtros lobster mt-4">

        <div class="row text-center g-1">

            <div class="col-6 col-md-3 borde-marron dropdown">
                <button
                    class="btn btn-lg fs-3 dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                >
                    Precio
                </button>

                <ul class="dropdown-menu">
                    <li>
                        <button class="dropdown-item" data-filtro="precio" data-valor="menor">
                            Menor a mayor
                        </button>
                    </li>

                    <li>
                        <button class="dropdown-item" data-filtro="precio" data-valor="mayor">
                            Mayor a menor
                        </button>
                    </li>
                </ul>
            </div>


            <div class="col-6 col-md-3 borde-marron dropdown">
                <button
                    class="btn btn-lg fs-3 dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                >
                    Disponibilidad
                </button>

                <ul class="dropdown-menu">
                    <li>
                        <button class="dropdown-item" data-filtro="disponibilidad" data-valor="disponible">
                            Disponible
                        </button>
                    </li>

                    <li>
                        <button class="dropdown-item" data-filtro="disponibilidad" data-valor="agotado">
                            Agotado
                        </button>
                    </li>
                </ul>
            </div>


            <div class="col-6 col-md-3 borde-marron dropdown">
                <button
                    class="btn btn-lg fs-3 dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                >
                    Sabor
                </button>

                <ul class="dropdown-menu" id="opciones-sabores">
                    <!-- Se completa desde PostgreSQL -->
                </ul>
            </div>


            <div class="col-6 col-md-3 borde-marron dropdown">
                <button
                    class="btn btn-lg fs-3 dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                >
                    Edición especial
                </button>

                <ul class="dropdown-menu">
                    <li>
                        <button class="dropdown-item" data-filtro="especial" data-valor="si">
                            Sí
                        </button>
                    </li>

                    <li>
                        <button class="dropdown-item" data-filtro="especial" data-valor="no">
                            No
                        </button>
                    </li>
                </ul>
            </div>

        </div>


        <div class="text-center mt-3">
            <button class="btn btn-sm rounded-4" id="limpiar-filtros">
                Limpiar filtros
            </button>
        </div>

    </div>


    <!-- Productos -->

    <div class="container-fluid mt-4 mb-5">
        <div class="row g-4 justify-content-center" id="contenedor-productos">
            <!-- Las tarjetas se generan desde js/inicio.js -->
        </div>
    </div>


    <!-- Footer -->

    <footer>
        <div class="container-fluid">

            <div class="row justify-content-around mt-4">

                <div class="col-8 liberty">
                    <a href="index.html">Amargo y Dulce</a>
                </div>

                <div class="col-2 pie">
                    <div class="row">

                        <div class="col">
                            <a href="index.html">Inicio</a>
                        </div>

                        <div class="col">
                            <a href="nosotros.html">Nosotros</a>
                        </div>

                    </div>
                </div>

            </div>


            <div class="row text-center">
                <div class="col info">
                    <p>
                        © 2025 Amargo y Dulce.
                        <br>
                        Para reclamos y consultas comunicarse al siguiente número:
                        +3442 222222
                    </p>
                </div>
            </div>

        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navegacion.js"></script>
    <script src="js/inicio.js"></script>

</body>
</html>
